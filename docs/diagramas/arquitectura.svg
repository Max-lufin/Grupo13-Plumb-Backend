<text x="348.0" y="66.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="700" fill="#4A5394" text-anchor="start" dominant-baseline="middle">Vercel: un proyecto, misma dirección (HTTPS automático)</text>
<text x="1248.0" y="66.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="700" fill="#4A5394" text-anchor="start" dominant-baseline="middle">Neon (PostgreSQL gestionado)</text>
<text x="50.0" y="280.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="20" font-weight="800" fill="#1C2470" text-anchor="start" dominant-baseline="middle">Navegador</text>
<text x="50.0" y="306.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="14" font-weight="500" fill="#4A5394" text-anchor="start" dominant-baseline="middle">Cliente, maestro o administrador</text>
<text x="50.0" y="330.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">React 19 corriendo en</text>
<text x="50.0" y="354.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">el equipo del usuario.</text>
<text x="50.0" y="390.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="700" fill="#D0202E" text-anchor="start" dominant-baseline="middle">Nunca habla con la BD.</text>
<text x="390.0" y="120.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="20" font-weight="800" fill="#1C2470" text-anchor="start" dominant-baseline="middle">Frontend</text>
<text x="390.0" y="146.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="14" font-weight="500" fill="#4A5394" text-anchor="start" dominant-baseline="middle">Grupo13-Plumb-Frontend (React + Vite)</text>
<text x="390.0" y="178.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">Archivos estáticos (dist/) en la CDN</text>
<text x="390.0" y="202.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">Rutas: /, /catalogo, /maestros/:rut,</text>
<text x="390.0" y="226.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">/solicitudes, /admin, /consultas</text>
<text x="390.0" y="250.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="700" fill="#1C2470" text-anchor="start" dominant-baseline="middle">Llama a /api/v1 en la misma dirección</text>
<text x="390.0" y="350.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">API REST</text>
<text x="390.0" y="376.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="14" font-weight="500" fill="#E8EBFF" text-anchor="start" dominant-baseline="middle">Grupo13-Plumb-Backend (Node 22 + Express 5), función serverless en Washington (iad1)</text>
<text x="412.0" y="411.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#FFE14D" text-anchor="start" dominant-baseline="middle">routes/</text>
<text x="580.0" y="411.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">mapa de la API /api/v1</text>
<text x="412.0" y="457.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#FFE14D" text-anchor="start" dominant-baseline="middle">controllers/</text>
<text x="580.0" y="457.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">leen la petición y eligen la respuesta</text>
<text x="412.0" y="503.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#FFE14D" text-anchor="start" dominant-baseline="middle">validators/</text>
<text x="580.0" y="503.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">forma de los datos → 400</text>
<text x="412.0" y="549.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#FFE14D" text-anchor="start" dominant-baseline="middle">models/</text>
<text x="580.0" y="549.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">SQL parametrizado y reglas → 422</text>
<text x="412.0" y="595.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#FFE14D" text-anchor="start" dominant-baseline="middle">middlewares/</text>
<text x="580.0" y="595.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">errores de la BD → 409 / 422</text>
<text x="395.0" y="640.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="14" font-weight="700" fill="#FFE14D" text-anchor="start" dominant-baseline="middle">Variables: DATABASE_URL, CORS_ORIGINS</text>
<text x="1280.0" y="280.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="20" font-weight="800" fill="#1C2470" text-anchor="start" dominant-baseline="middle">PostgreSQL 17</text>
<text x="1280.0" y="306.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="14" font-weight="500" fill="#4A5394" text-anchor="start" dominant-baseline="middle">AWS us-east-2 (Ohio), TLS</text>
<text x="1280.0" y="330.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="700" fill="#1C2470" text-anchor="start" dominant-baseline="middle">6 tablas + 1 vista</text>
<text x="1280.0" y="356.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">region, oficio, cliente, maestro,</text>
<text x="1280.0" y="382.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">solicitud, calificacion</text>
<text x="1280.0" y="408.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">v_reputacion_maestro</text>
<text x="1280.0" y="434.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="700" fill="#1C2470" text-anchor="start" dominant-baseline="middle">CHECK, UNIQUE, FK RESTRICT</text>
<text x="1280.0" y="460.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">y CASCADE en la BD</text>
<text x="238.3" y="213.5" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1</text>
<text x="310.0" y="212.5" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="14" font-weight="600" fill="#1C2470" text-anchor="middle" dominant-baseline="middle">Descarga la app</text>
<text x="243.8" y="386.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2</text>
<text x="320.0" y="385.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="14" font-weight="600" fill="#1C2470" text-anchor="middle" dominant-baseline="middle">JSON por HTTPS</text>
<text x="1144.2" y="396.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="1205.0" y="395.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="14" font-weight="600" fill="#1C2470" text-anchor="middle" dominant-baseline="middle">SQL por TLS</text>
<text x="54.0" y="752.0" font-family="Archivo, 'Archivo Variable', sans-serif" font-size="17" font-weight="800" fill="#1C2470" text-anchor="start" dominant-baseline="middle">En desarrollo (equipo de cada integrante)</text>
<text x="54.0" y="790.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">docker compose up -d  (PostgreSQL 17 local)</text>
<text x="834.0" y="790.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">npm run db:init  (esquema + datos)</text>
<text x="54.0" y="822.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">npm run dev  (API en :3000)</text>
<text x="834.0" y="822.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1C2470" text-anchor="start" dominant-baseline="middle">npm run dev  (web en :5173, /api → :3000)</text>
</svg>
