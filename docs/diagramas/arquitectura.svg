<text x="348.0" y="66.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="700" fill="#4D4D4D" text-anchor="start" dominant-baseline="middle">Vercel: un proyecto, misma dirección (HTTPS automático)</text>
<text x="1248.0" y="226.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="700" fill="#4D4D4D" text-anchor="start" dominant-baseline="middle">MongoDB Atlas</text>
<text x="50.0" y="280.0" font-family="Carlito, Calibri, sans-serif" font-size="20" font-weight="800" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">Navegador</text>
<text x="50.0" y="306.0" font-family="Carlito, Calibri, sans-serif" font-size="14" font-weight="500" fill="#4D4D4D" text-anchor="start" dominant-baseline="middle">Visitante, cliente, maestro o admin.</text>
<text x="50.0" y="330.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">React 19 corriendo en</text>
<text x="50.0" y="354.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">el equipo del usuario.</text>
<text x="50.0" y="386.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">Guarda el token de sesión;</text>
<text x="50.0" y="418.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">nunca habla con la BD.</text>
<text x="390.0" y="120.0" font-family="Carlito, Calibri, sans-serif" font-size="20" font-weight="800" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">Frontend</text>
<text x="390.0" y="146.0" font-family="Carlito, Calibri, sans-serif" font-size="14" font-weight="500" fill="#4D4D4D" text-anchor="start" dominant-baseline="middle">frontend/ (React 19 + Vite)</text>
<text x="390.0" y="178.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">Archivos estáticos (dist/) en la CDN</text>
<text x="390.0" y="202.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">Rutas: /, /catalogo, /maestros/:rut, /ingresar,</text>
<text x="390.0" y="226.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">/solicitudes, /admin, /consultas, /nosql</text>
<text x="390.0" y="250.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">Llama a /api/v1 en la misma dirección</text>
<text x="390.0" y="350.0" font-family="Carlito, Calibri, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">API REST</text>
<text x="390.0" y="376.0" font-family="Carlito, Calibri, sans-serif" font-size="14" font-weight="500" fill="#E8EBFF" text-anchor="start" dominant-baseline="middle">backend/ (Node 22 + Express 5), función serverless en Washington (iad1)</text>
<text x="412.0" y="411.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#D9D9D9" text-anchor="start" dominant-baseline="middle">middlewares/</text>
<text x="580.0" y="411.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">sesión (JWT), registro y errores → 401 / 403 / 409</text>
<text x="412.0" y="457.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#D9D9D9" text-anchor="start" dominant-baseline="middle">routes/</text>
<text x="580.0" y="457.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">mapa de la API /api/v1 y permisos por rol</text>
<text x="412.0" y="503.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#D9D9D9" text-anchor="start" dominant-baseline="middle">controllers/</text>
<text x="580.0" y="503.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">leen la petición y eligen la respuesta</text>
<text x="412.0" y="549.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#D9D9D9" text-anchor="start" dominant-baseline="middle">validators/</text>
<text x="580.0" y="549.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">forma de los datos (Zod) → 400</text>
<text x="412.0" y="595.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#D9D9D9" text-anchor="start" dominant-baseline="middle">models/</text>
<text x="580.0" y="595.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle">consultas MQL, transacciones y reglas → 422</text>
<text x="395.0" y="640.0" font-family="Carlito, Calibri, sans-serif" font-size="14" font-weight="700" fill="#D9D9D9" text-anchor="start" dominant-baseline="middle">Variables: MONGODB_URI, SESION_SECRETO, CORS_ORIGINS</text>
<text x="1280.0" y="280.0" font-family="Carlito, Calibri, sans-serif" font-size="20" font-weight="800" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">MongoDB 8.0</text>
<text x="1280.0" y="306.0" font-family="Carlito, Calibri, sans-serif" font-size="14" font-weight="500" fill="#4D4D4D" text-anchor="start" dominant-baseline="middle">AWS us-east-1 (Virginia), clúster M0, TLS</text>
<text x="1280.0" y="330.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">3 colecciones + 1 técnica</text>
<text x="1280.0" y="356.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">usuarios, oficios, solicitudes,</text>
<text x="1280.0" y="382.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">contadores</text>
<text x="1280.0" y="408.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">$jsonSchema, índices y</text>
<text x="1280.0" y="434.0" font-family="Carlito, Calibri, sans-serif" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">transacciones multi-documento</text>
<text x="238.3" y="213.5" font-family="Carlito, Calibri, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">1</text>
<text x="310.0" y="212.5" font-family="Carlito, Calibri, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="middle" dominant-baseline="middle">Descarga la app</text>
<text x="255.2" y="406.0" font-family="Carlito, Calibri, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">2</text>
<text x="320.0" y="405.0" font-family="Carlito, Calibri, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="middle" dominant-baseline="middle">JSON + token</text>
<text x="1143.0" y="397.0" font-family="Carlito, Calibri, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="1205.0" y="396.0" font-family="Carlito, Calibri, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="middle" dominant-baseline="middle">MQL por TLS</text>
<text x="54.0" y="752.0" font-family="Carlito, Calibri, sans-serif" font-size="17" font-weight="800" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">En desarrollo (equipo de cada integrante)</text>
<text x="54.0" y="790.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">docker compose up -d  (MongoDB 8 local)</text>
<text x="834.0" y="790.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">npm run db:init  (colecciones + datos)</text>
<text x="54.0" y="822.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">npm run dev  (API en :3000)</text>
<text x="834.0" y="822.0" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start" dominant-baseline="middle">npm run dev  (web en :5173, /api → :3000)</text>
</svg>
