# MongoDB local para desarrollo: docker compose up -d
# Se levanta como replica set de un nodo porque las transacciones lo requieren.
services:
  bd:
    image: mongo:8
    container_name: plumb-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27019:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      retries: 20
